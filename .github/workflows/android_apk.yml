# Fabrica el APK de Android en cada cambio de la rama main
# y lo publica en Releases para descargarlo desde el móvil.
name: APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar plataformas y permisos Bluetooth
        run: |
          bash tool/preparar_plataformas.sh
          flutter pub get

      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk mx5diag.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Diagnóstico de Averías Fácil · compilación ${{ github.run_number }}
          body: |
            APK de Android generado automáticamente a partir del commit ${{ github.sha }}.
            Descárgalo en el móvil e instálalo encima de la versión anterior (no se pierde el historial).
          files: mx5diag.apk
          make_latest: true
